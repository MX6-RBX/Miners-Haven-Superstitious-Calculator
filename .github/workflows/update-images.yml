name: Update Roblox Images

on:
  workflow_dispatch:
  push:
    paths:
      - "Data.js"

permissions:
  contents: write

jobs:
  update-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update Images.js
        run: python update_images.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Images.js

          if git diff --cached --quiet; then
            echo "No image changes."
          else
            git commit -m "Update Roblox image URLs"
            git push
          fi
