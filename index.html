<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miners Haven Recipe Builder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div><h1>Miners Haven</h1><p>Recipe Builder</p></div>
    <div class="header-actions"><button id="clearBtn" class="secondary">Clear Recipe</button></div>
  </header>

  <main>
    <section class="panel builder">
      <div class="section-title"><h2>Recipe Maker</h2><span id="itemCount">0 items</span></div>

      <div class="target-picker" id="targetPicker">
        <div class="picker-title"><div><h3>Select a Superstitious Item</h3><p>The selected item's catalyst becomes the recipe target.</p></div></div>
        <div id="superstitiousGrid" class="item-grid"></div>
      </div>

      <div id="recipeTarget" class="recipe-target hidden"></div>

      <div class="recipe-heading"><h3>Items in Recipe</h3><span>Click an item below to add it</span></div>
      <div id="recipe" class="recipe empty"><div class="empty-state">Select a Superstitious Item above to begin.</div></div>

      <div class="catalog-heading"><h3>Items</h3><span id="catalogCount"></span></div>
      <div id="itemGrid" class="item-grid catalog-grid"></div>
    </section>

    <aside class="panel totals">
      <div class="section-title"><h2>Element Requirements</h2></div>
      <div id="elements"></div>
    </aside>
  </main>
</div>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
