<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Miners Haven - Superstitious Crafting</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="header-content">
            <h1>Miners Haven</h1>
            <span>Superstitious Crafting Calculator</span>
        </div>
    </header>


    <main>

        <!-- ITEM LIST -->

        <section id="itemListPage">

            <div class="page-title">
                <h2>Superstitious Items</h2>

                <input
                    id="searchBox"
                    type="text"
                    placeholder="Search items..."
                >
            </div>


            <div id="itemGrid"></div>

        </section>


        <!-- CRAFTING PAGE -->

        <section
            id="craftingPage"
            class="hidden"
        >

            <button
                id="backButton"
                class="back-button"
            >
                ← Back
            </button>


            <div id="craftingContent"></div>

        </section>

    </main>


    <script src="data.js"></script>
    <script src="script.js"></script>

</body>
</html>
